- name: "Setup Grafana Restarter"
  vars_files:
    - vars/prod.yml
  gather_facts: no
  hosts: castle
  remote_user: "{{remote_admin}}"
  become: true
  become_method: sudo
  tasks:
    - name: Create script folder /opt/grafana/scripts
      file:
        path: /opt/grafana/scripts
        state: directory
        owner: grafana
        group: users
        mode: '0700'

    - name: Render local script file restarter.sh to /opt/grafana/scripts/
      template:
        src: data-restarter/restarter.sh
        dest: /opt/grafana/scripts/restarter.sh
        owner: grafana
        group: users
        mode: '0500'

    - name: Copy systemd devops-grafana-restarter.service file to /etc/systemd/system/
      copy:
        src: data-restarter/devops-grafana-restarter.service
        dest: /etc/systemd/system/
        owner: root
        group: root

    - name: Copy systemd devops-grafana-restarter.timer file to /etc/systemd/system/
      copy:
        src: data-restarter/devops-grafana-restarter.timer
        dest: /etc/systemd/system/
        owner: root
        group: root

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start timer
      systemd:
        name: devops-grafana-restarter.timer
        state: started
        enabled: true
